<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Active Tribe – Move Together. Grow Together.</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ch:#15181a;--ch2:#23282b;--lime:#c6ff3d;--or:#ff6b2c;--bg:#f2f3f1;--card:#fff;--tx:#15181a;--mu:#6a7275;--ln:#e1e4e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1112;--card:#1b1f21;--tx:#f2f3f1;--mu:#9aa3a6;--ln:#2c3235}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 'DM Sans',system-ui,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:99px;padding:.65em 1.2em;font-weight:700;background:var(--ch);color:#fff;transition:transform .15s,background .15s}
button:hover{transform:translateY(-2px)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.lime{background:var(--lime);color:var(--ch)}.or{background:var(--or);color:#fff}.ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ch);color:#fff;display:flex;align-items:center;gap:6px;padding:10px 18px;overflow-x:auto}
nav b{font-size:1.2rem;font-weight:900;margin-right:auto;white-space:nowrap}nav b span{color:var(--lime)}
nav a{color:#cfd5d7;text-decoration:none;padding:.4em .8em;border-radius:99px;font-weight:500;white-space:nowrap}nav a.on,nav a:hover{background:var(--ch2);color:var(--lime)}
main{max-width:1150px;margin:0 auto;padding:24px 18px 60px;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
h1,h2,h3{margin:0;line-height:1.05;font-weight:900;letter-spacing:-.02em}h1{font-size:clamp(2.4rem,7vw,5rem)}h2{font-size:clamp(1.6rem,4vw,2.4rem);margin-bottom:14px}
.hero{background:radial-gradient(circle at 80% 20%,#2c3a12,transparent 50%),var(--ch);color:#fff;border-radius:28px;padding:clamp(28px,6vw,72px);position:relative;overflow:hidden;margin-bottom:28px}
.hero p{max-width:480px;color:#cfd5d7;font-size:1.1rem}.hero .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.hero svg{position:absolute;right:-40px;bottom:-30px;width:60%;opacity:.9;pointer-events:none}
.path{stroke-dasharray:900;stroke-dashoffset:900;animation:dr 3s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;overflow:hidden}.pad{padding:16px}
.cover{height:150px;display:flex;align-items:flex-end;padding:14px;color:#fff;font-weight:900;font-size:1.25rem;line-height:1.1;transition:transform .4s;position:relative;overflow:hidden;text-shadow:0 2px 8px #0006}.cover::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(135deg,#ffffff12 0 2px,transparent 2px 16px)}.cover::after{content:'';position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:var(--lime);opacity:.3}
.card:hover .cover{transform:scale(1.04)}.cw{overflow:hidden}
.tag{display:inline-block;padding:.15em .7em;border-radius:99px;background:var(--bg);font-size:.8rem;font-weight:700;margin:0 4px 4px 0}
.mu{color:var(--mu);font-size:.9rem}.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--lime);border-radius:9px;transition:width .6s}
.kpi{font-size:2.2rem;font-weight:900}.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
input,select{font:inherit;padding:.6em .9em;border-radius:12px;border:1.5px solid var(--ln);background:var(--card);color:var(--tx);min-width:0}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px}.bars div{flex:1;background:var(--lime);border-radius:8px 8px 0 0;transition:height .5s;cursor:pointer;position:relative}.bars div:hover{background:var(--or)}
.bars span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:.75rem;color:var(--mu)}
.sample{font-size:.75rem;color:var(--mu);margin:2px 0 10px}
table{width:100%;border-collapse:collapse;font-size:.92rem}td,th{text-align:left;padding:9px 8px;border-bottom:1px solid var(--ln)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:var(--ch);background:var(--lime);flex:none}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--ln)}.tabs button.on{background:var(--ch);color:var(--lime)}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:50;padding:16px;animation:fd .2s}@keyframes fd{from{opacity:0}}
.modal>div{background:var(--card);border-radius:24px;padding:26px;max-width:460px;width:100%;max-height:90vh;overflow:auto;animation:in .3s}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ch);color:var(--lime);padding:12px 18px;border-radius:16px;z-index:60;font-weight:700;animation:in .3s;max-width:80vw}
.chip{cursor:pointer;padding:.5em 1em;border:1.5px solid var(--ln);border-radius:99px;background:var(--card);color:var(--tx);font-weight:500}.chip.on{background:var(--lime);color:var(--ch);border-color:var(--lime)}
.err{color:#d0361a;font-size:.85rem}.conf{position:fixed;top:-10px;width:9px;height:14px;z-index:70;animation:fall 1.6s linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.skel{height:90px;border-radius:16px;background:linear-gradient(90deg,var(--ln),var(--bg),var(--ln));background-size:200% 100%;animation:sk 1s infinite}@keyframes sk{to{background-position:-200% 0}}
.stag>*{animation:in .45s both}
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 40%,#2c3a12,#15181a 60%);color:#fff;display:grid;place-items:center;text-align:center;padding:24px;transition:opacity .6s,transform .6s}#splash.out{opacity:0;transform:scale(1.05);pointer-events:none}
#splash .lg{font-size:clamp(2.6rem,10vw,5.5rem);font-weight:900;letter-spacing:-.03em;animation:pop .9s both}#splash .lg span{color:var(--lime)}@keyframes pop{from{opacity:0;transform:scale(.8) translateY(20px)}}
#splash .pf{margin:18px auto 6px;font-size:1.1rem;color:#cfd5d7;animation:in 1s .6s both}#splash .pf b{display:block;font-size:1.6rem;color:#fff}#splash .ld{width:160px;height:4px;background:#ffffff26;border-radius:9px;margin:26px auto;overflow:hidden}#splash .ld i{display:block;height:100%;background:var(--lime);animation:ldx 2.4s ease forwards}@keyframes ldx{from{width:0}to{width:100%}}
.side{display:grid;gap:6px}.pill{display:inline-block;padding:.15em .7em;border-radius:99px;font-size:.8rem;font-weight:700}.ok{background:#c6ff3d;color:#15181a}.warn{background:#ff6b2c;color:#fff}.mid{background:var(--ln)}.hb{display:flex;align-items:center;gap:8px;margin:6px 0}.hb span{width:120px;font-size:.85rem}.hb .bar{flex:1}.sm{padding:.3em .8em;font-size:.82rem}
.ft{text-align:center;color:var(--mu);font-size:.85rem;margin-top:40px}
.chipf{position:absolute;background:#ffffff1c;backdrop-filter:blur(8px);border:1px solid #ffffff30;border-radius:16px;padding:10px 14px;color:#fff;font-weight:700;animation:flt 5s ease-in-out infinite}@keyframes flt{50%{transform:translateY(-10px)}}@media(max-width:700px){.chipf{display:none}}
.mq{display:flex;overflow:hidden;white-space:nowrap;background:var(--lime);color:var(--ch);border-radius:99px;padding:12px 0;font-weight:900;margin-bottom:34px}.mq div{display:flex;gap:40px;padding-right:40px;animation:mqa 22s linear infinite}@keyframes mqa{to{transform:translateX(-100%)}}
.rv{opacity:0;transform:translateY(22px);transition:opacity .6s,transform .6s}.rv.vis{opacity:1;transform:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal b{text-align:center;font-size:.8rem;color:var(--mu)}.day{aspect-ratio:1;border-radius:12px;background:var(--card);border:1px solid var(--ln);display:flex;flex-direction:column;padding:6px;cursor:pointer;font-weight:700;color:inherit;transition:transform .15s;align-items:flex-start}.day:hover{transform:scale(1.06)}.day.on{background:var(--ch);color:var(--lime)}.day.today{border-color:var(--or)}.day i{width:8px;height:8px;border-radius:50%;background:var(--or);margin-top:auto}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.path{stroke-dashoffset:0}}
</style></head><body>
<div id="splash"><div><div class="lg">ACTIVE<span>TRIBE</span></div><div class="mu" style="color:var(--lime);font-weight:700">Move Together. Grow Together.</div><div class="pf">A platform concept prepared for<b>Juan Ayala Santiago</b>Co-founder &amp; General Manager, Active Tribe</div><div class="ld"><i></i></div><button class="lime" onclick="closeSplash()">Enter the prototype</button><p class="mu" style="font-size:.78rem">Proposed concept by Profi Stack. Fictional demo data.</p></div></div>
<nav id="nav" aria-label="Main"></nav><main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const COL={Strength:'#2d3a14',Running:'#c2410c',Cycling:'#0f5f6b',Yoga:'#5b3a8a',Functional:'#8a2f2f',Group:'#1f4d2e'};
const S={route:'home',name:'Alex Member',goal:5,done:3,week:[1,0,2,1,0,0,0],points:240,
 acts:[{id:1,n:'Sunrise 5K Club Run',c:'Running',d:'Sat 7:00',dur:'45 min',lv:'Beginner',g:'Group',loc:'Sample Park A',left:8},
  {id:2,n:'Full-Body Strength Basics',c:'Strength',d:'Mon 18:00',dur:'60 min',lv:'Beginner',g:'Group',loc:'Sample Studio 1',left:5},
  {id:3,n:'Weekend Social Ride',c:'Cycling',d:'Sun 8:30',dur:'90 min',lv:'Intermediate',g:'Group',loc:'Sample Trail',left:12},
  {id:4,n:'Flow & Stretch Yoga',c:'Yoga',d:'Wed 19:00',dur:'50 min',lv:'Beginner',g:'Individual',loc:'Sample Studio 2',left:9},
  {id:5,n:'Functional Circuit',c:'Functional',d:'Thu 17:30',dur:'40 min',lv:'Advanced',g:'Group',loc:'Sample Gym',left:3},
  {id:6,n:'Community Park Games',c:'Group',d:'Fri 16:00',dur:'75 min',lv:'Beginner',g:'Group',loc:'Sample Park B',left:20}],
 reg:[],fav:[],q:'',cat:'All',lv:'All',
 ch:[{id:1,n:'7-Day Move Streak',goal:'Be active 7 days',dur:'7 days',p:312,max:7,my:null,c:'Running'},
  {id:2,n:'100 km Community Ride',goal:'Ride together: 100 km',dur:'30 days',p:187,max:100,my:null,c:'Cycling'},
  {id:3,n:'Consistency Club',goal:'12 sessions',dur:'4 weeks',p:540,max:12,my:null,c:'Strength'}],
 lb:'Weekly',badges:{first:0,streak:0,comm:0,week:0},
 feed:[{id:1,u:'Sample Member A',t:'2h',x:'Completed a weekly challenge 🎉',l:14,lk:0,cm:['Great work!']},
  {id:2,u:'Sample Member B',t:'5h',x:'Joined the Sunday group ride.',l:9,lk:0,cm:[]},
  {id:3,u:'Sample Member C',t:'1d',x:'Hit a personal activity milestone.',l:22,lk:0,cm:[]}],
 groups:{Running:[128,0],Cycling:[96,0],Yoga:[74,0],Outdoor:[61,0]},
 rep:[{id:1,x:'Post flagged: off-topic link',s:'Pending'},{id:2,x:'Comment flagged: language',s:'Pending'}],
 mem:[['M-001','Sample Member A','a@example.com','2026-09-01','Running','Active'],['M-002','Sample Member B','b@example.com','2026-09-14','Yoga','Active'],['M-003','Sample Member C','c@example.com','2026-10-02','Cycling','Paused']],
 notes:['Welcome to Active Tribe (demo)'],joined:false};
const BN={first:'First Challenge',streak:'Consistency Champion',comm:'Community Participant',week:'Weekly Goal Achieved'};
const R=['home','discover','programmes','challenges','events','community','dashboard','profile','admin'];
const LBL={events:'Events',profile:'Profile',programmes:'Programmes',home:'Home',discover:'Explore Activities',challenges:'Challenges',community:'Community',dashboard:'My Dashboard',admin:'Admin'};
function toast(m){S.notes.unshift(m);const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function conf(){for(let i=0;i<50;i++){const e=document.createElement('i');e.className='conf';e.style.left=Math.random()*100+'vw';e.style.background=['#c6ff3d','#ff6b2c','#fff'][i%3];e.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}}
function unlock(k){if(!S.badges[k]){S.badges[k]=1;S.points+=50;conf();toast('Badge unlocked: '+BN[k])}}
function go(r){S.route=r;location.hash=r;render()}
function ring(p,sz=120){const r=sz/2-10,c=2*Math.PI*r;return `<svg width="${sz}" height="${sz}" role="img" aria-label="${Math.round(p)}%"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="var(--ln)" stroke-width="10"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="#c6ff3d" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.min(p,100)/100)}" transform="rotate(-90 ${sz/2} ${sz/2})" style="transition:stroke-dashoffset .8s"/><text x="50%" y="54%" text-anchor="middle" font-weight="900" font-size="${sz/5}" fill="currentColor">${Math.round(p)}%</text></svg>`}
function actCard(a){const f=S.fav.includes(a.id),r=S.reg.includes(a.id);return `<div class="card"><div class="cw"><div class="cover" style="background:linear-gradient(135deg,${COL[a.c]},#15181a)">${a.n}</div></div><div class="pad"><span class="tag">${a.c}</span><span class="tag">${a.lv}</span><span class="tag">${a.g}</span><div class="mu">${a.d} · ${a.dur}<br>${a.loc} (sample)<br>${a.left} places left (demo)</div><div class="row" style="margin-top:10px"><button class="${r?'':'lime'}" onclick="reg(${a.id})">${r?'Cancel registration':'Register'}</button><button class="ghost" aria-pressed="${f}" onclick="fav(${a.id})">${f?'★ Saved':'☆ Save'}</button></div></div></div>`}
function reg(id){const a=S.acts.find(x=>x.id==id);if(S.reg.includes(id)){S.reg=S.reg.filter(x=>x!=id);a.left++;toast('Registration cancelled')}else{if(!a.left)return toast('This activity is full');S.reg.push(id);a.left--;conf();toast('Registered: '+a.n)}render()}
function fav(id){S.fav=S.fav.includes(id)?S.fav.filter(x=>x!=id):[...S.fav,id];render()}
function doActivity(){S.done++;S.week[new Date().getDay()%7]++;S.points+=10;if(S.done>=S.goal)unlock('week');toast('Activity logged (+10 points)');render()}
function joinCh(id){const c=S.ch.find(x=>x.id==id);c.my=c.my??0;c.p++;unlock('first');toast('Joined '+c.n);render()}
function upCh(id){const c=S.ch.find(x=>x.id==id);if(c.my>=c.max)return;c.my++;S.points+=5;if(c.my==c.max){conf();unlock('streak');toast('Challenge complete!')}render()}
function like(id){const p=S.feed.find(x=>x.id==id);p.lk=!p.lk;p.l+=p.lk?1:-1;render()}
function cmt(id){const p=S.feed.find(x=>x.id==id),v=prompt('Add a comment');if(v&&v.trim()){p.cm.push(v.trim().slice(0,140));unlock('comm');render()}}
function post(){const v=$('#np').value.trim();if(v.length<3)return $('#pe').textContent='Write at least 3 characters.';S.feed.unshift({id:Date.now(),u:S.name,t:'now',x:v.slice(0,200),l:0,lk:0,cm:[]});toast('Post shared');render()}
function grp(k){S.groups[k][1]=!S.groups[k][1];S.groups[k][0]+=S.groups[k][1]?1:-1;if(S.groups[k][1])unlock('comm');render()}
function modal(h){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div role="dialog" aria-modal="true">${h}</div>`;m.onclick=e=>{if(e.target==m)m.remove()};document.body.appendChild(m);return m}
function onboard(step=1,d={}){document.querySelector('.modal')?.remove();
 if(step==1)return modal(`<h2>Your Active Journey Starts Here.</h2><p class="mu">Demo sign-up. No health data is collected.</p><label>Full name<br><input id="on" value="${d.n||''}" style="width:100%"></label><p class="err" id="oe"></p><label>Email<br><input id="oem" type="email" value="${d.e||''}" style="width:100%"></label><p class="err" id="oee"></p><button class="lime" onclick="obNext()">Continue</button>`);
 if(step==2){const I=['Strength','Running','Cycling','Yoga','Functional','Group','Outdoor','Wellness'];return modal(`<h2>Pick your interests</h2><div class="row wrap" id="ints">${I.map(i=>`<button class="chip ${d.i?.includes(i)?'on':''}" onclick="this.classList.toggle('on')">${i}</button>`).join('')}</div><p class="err" id="oe"></p><div class="row" style="margin-top:16px"><button class="ghost" onclick="onboard(1,window._d)">Back</button><button class="lime" onclick="obFin()">Continue</button></div>`)}
 modal(`<h2>Welcome to Your Tribe!</h2><p>${d.n}, you're in. Your dashboard is ready.</p><button class="lime" onclick="document.querySelector('.modal').remove();go('dashboard')">Explore Your Dashboard</button>`);conf()}
function obNext(){const n=$('#on').value.trim(),e=$('#oem').value.trim();let ok=1;$('#oe').textContent=n.length<2?(ok=0,'Enter your full name.'):'';$('#oee').textContent=/^\S+@\S+\.\S+$/.test(e)?'':(ok=0,'Enter a valid email address.');if(ok){window._d={n,e};onboard(2,window._d)}}
function obFin(){const i=[...document.querySelectorAll('#ints .on')].map(b=>b.textContent);if(!i.length)return $('#oe').textContent='Select at least one interest.';window._d.i=i;S.name=window._d.n;S.joined=1;S.mem.push(['M-00'+(S.mem.length+1),S.name,window._d.e,'2026-11-12',i[0],'Active']);toast('Welcome, '+S.name+'!');onboard(3,window._d)}
function newAct(){modal(`<h2>Create activity</h2><label>Name<br><input id="an" style="width:100%"></label><p class="err" id="ae"></p><label>Category<br><select id="ac">${Object.keys(COL).map(c=>`<option>${c}</option>`).join('')}</select></label><br><br><label>Places<br><input id="al" type="number" value="10" min="1"></label><br><br><button class="lime" onclick="saveAct()">Publish</button>`)}
function saveAct(){const n=$('#an').value.trim();if(n.length<3)return $('#ae').textContent='Enter a name (3+ characters).';S.acts.unshift({id:Date.now(),n,c:$('#ac').value,d:'TBC',dur:'60 min',lv:'Beginner',g:'Group',loc:'Sample Venue',left:+$('#al').value||10});document.querySelector('.modal').remove();toast('Published: '+n+' (now in Explore Activities)');render()}
function lbRows(){const base={Weekly:[['Sample Member A',420],['Sample Member B',380],['Sample Member C',310]],Friends:[['Sample Member B',380],['Sample Member D',290]],Global:[['Sample Member E',980],['Sample Member A',860],['Sample Member F',790]]}[S.lb];return [...base,[S.name+' (you)',S.points]].sort((a,b)=>b[1]-a[1])}
const V={
home(){return `<div class="hero"><svg class="px" viewBox="0 0 400 300" fill="none" stroke="#c6ff3d" stroke-width="5" stroke-linecap="round"><circle cx="300" cy="150" r="130" stroke-opacity=".15"/><circle cx="300" cy="150" r="90" stroke="#ff6b2c" stroke-opacity=".3"/><circle cx="300" cy="150" r="50" stroke-opacity=".4"/><path class="path" d="M10 280C80 100 150 260 220 140S330 60 390 20"/><circle cx="390" cy="20" r="10" fill="#ff6b2c" stroke="none"/><g stroke="#fff" stroke-width="7"><circle cx="300" cy="105" r="9" fill="#fff"/><path d="M300 118l-6 34 18 18M294 152l-18 30M298 128l-20 12M300 128l20-14"/></g></svg><div class="chipf" style="right:6%;top:10%">🔥 12-day streak</div><div class="chipf" style="right:34%;bottom:8%;animation-delay:1.5s">🏅 Challenge complete</div><div class="chipf" style="right:3%;bottom:32%;animation-delay:3s">👥 1,240 in the tribe (demo)</div><h1>Find Your Movement.<br>Build Your Tribe.</h1><p>Discover new activities, challenge yourself and become part of a community that moves together.</p><div class="row"><button class="lime" onclick="go('discover')">Explore Activities</button><button class="ghost" onclick="onboard()">Join the Tribe</button></div></div>
<div class="card pad row sp wrap" style="margin-bottom:22px"><div><b>Prepared for Juan Ayala Santiago</b><div class="mu">Co-founder &amp; General Manager, Active Tribe</div></div><span class="mu">Proposed concept by Profi Stack. Not an existing Active Tribe platform. All content is fictional demo data.</span></div>
<div class="mq" aria-hidden="true">${[0,1].map(()=>'<div><span>Strength</span><span>Running</span><span>Cycling</span><span>Yoga</span><span>Functional</span><span>Group sessions</span><span>Outdoor</span><span>Wellness</span></div>').join('')}</div><h2>Featured activities</h2><div class="grid stag">${S.acts.slice(0,6).map(actCard).join('')}</div>
<h2 style="margin-top:34px">Make every move count.</h2><div class="grid">${S.ch.map(c=>`<div class="card pad"><h3>${c.n}</h3><p class="mu">${c.goal} · ${c.dur} · ${c.p} participants (demo)</p><div class="bar"><i style="width:${(c.my??0)/c.max*100}%"></i></div><br><button class="${c.my==null?'lime':'ghost'}" onclick="${c.my==null?`joinCh(${c.id})`:`go('challenges')`}">${c.my==null?'Join challenge':'View challenge'}</button></div>`).join('')}</div>
